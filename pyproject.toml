[project]
name = "realtime-news-sentiment"
version = "0.2.0"
description = "Real-time news sentiment dashboard powered by Hugging Face Transformers and Streamlit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser==6.0.11",
    "pandas==2.3.1",
    "plotly==6.2.0",
    "streamlit==1.48.0",
    "torch==2.7.1",
    "transformers==4.53.3",
]

[project.optional-dependencies]
api = [
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
]
dev = [
    "pytest==8.4.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
