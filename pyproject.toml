[project]
name = "realtime-news-sentiment"
version = "0.3.0"
description = "Regional news sentiment dashboard and API: live RSS headlines scored by a three-class RoBERTa model, with 30/90-day regional trends."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "feedparser==6.0.11",
    "torch==2.7.1",
    "transformers==4.53.3",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
