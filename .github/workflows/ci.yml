name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest -q

  deploy-space:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-space
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Stage the Space
        run: |
          mkdir space
          cp -r Dockerfile backend frontend newsent requirements.txt \
            pyproject.toml uv.lock .python-version LICENSE .gitignore space/
          cat .github/space/header.md README.md > space/README.md
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx --from huggingface_hub==2.4.0 hf upload \
            iamaber/global-news-sentiment space . \
            --repo-type space \
            --commit-message "Deploy ${GITHUB_SHA::7} from GitHub"
