name: Collect history

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out the history branch
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" history > /dev/null; then
            git clone --depth 1 --branch history "$REMOTE" history-data
          else
            git init --initial-branch history history-data
            git -C history-data remote add origin "$REMOTE"
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache the sentiment model
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-model-${{ hashFiles('newsent/model.py') }}

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Collect and score headlines
        run: uv run python -m newsent.collect history-data

      - name: Commit and push
        working-directory: history-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit --quiet --message "history: $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push origin HEAD:history; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              git pull --rebase origin history
            fi
          done
          exit 1
